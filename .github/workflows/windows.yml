name: HISTOSETS desktop
on:
  push:
    branches: [main, update1, update2, update4]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: histosets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  storage:
    name: SQLite import and recovery (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/HistOSets.Core.Tests -c Release -- .
      - run: dotnet run --project tests/HistOSets.Storage.Tests -c Release -- .
  viewer:
    name: Viewer and tiled images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Viewer/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix Viewer
      - run: npm run build --prefix Viewer
      - run: python -m pip install Pillow==12.1.1
      - run: python Viewer/tests/make-fixtures.py
      - run: npx playwright install --with-deps chromium
        working-directory: Viewer
      - run: npm test --prefix Viewer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewer-test-results
          path: |
            Viewer/playwright-report
            artifacts/viewer-*.png
          retention-days: 30
  windows:
    name: Windows build and launch
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Viewer/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci --prefix Viewer
      - run: npm run build --prefix Viewer
      - run: dotnet run --project tests/HistOSets.Core.Tests -c Release -- .
      - run: dotnet run --project tests/HistOSets.Storage.Tests -c Release -- .
      - run: dotnet build HistOSets.sln -c Release --warnaserror
      - name: WPF and WebView2 smoke checks
        run: dotnet run --project tests/HistOSets.Windows.Smoke -c Release -- artifacts
      - name: Publish portable Windows x64
        run: dotnet publish HistOSets.csproj -c Release -r win-x64 --self-contained true -o artifacts/HISTOSETS-update4-windows-x64
      - name: Start published application from another working directory
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'artifacts/HISTOSETS-update4-windows-x64/HistOSets.exe'
          $process = Start-Process -FilePath $exe -WorkingDirectory $env:TEMP -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(30)
            do {
              Start-Sleep -Milliseconds 300
              $process.Refresh()
            } while (!$process.HasExited -and $process.MainWindowHandle -eq 0 -and (Get-Date) -lt $deadline)
            if ($process.HasExited -or $process.MainWindowHandle -eq 0) { throw 'Main window did not open' }
            if ($process.MainWindowTitle -ne 'HISTOSETS — update4') { throw "Unexpected window: $($process.MainWindowTitle)" }
            $null = $process.CloseMainWindow()
            if (!$process.WaitForExit(10000)) { throw 'Application did not close cleanly' }
            if ($process.ExitCode -ne 0) { throw "Exit code: $($process.ExitCode)" }
          } finally {
            if (!$process.HasExited) { $process.Kill() }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: HISTOSETS-update4-windows-x64
          path: artifacts/HISTOSETS-update4-windows-x64/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke-results
          path: artifacts/native-*.png
          retention-days: 30
